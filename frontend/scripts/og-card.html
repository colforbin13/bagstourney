<!doctype html>
<!--
  Source for frontend/src/assets/og-card.png, the 1200x630 image link previews show.
  It is a static brand card, regenerated by hand only when the look changes:

    chrome --headless=new --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=8000 --screenshot=frontend/src/assets/og-card.png \
      frontend/scripts/og-card.html

  Needs network access once, for the Archivo font. Colours mirror global.scss.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bracketway share card</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #1FBF6B;
    color: #141414;
    font-family: 'Archivo', Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; padding: 64px 72px 0; }
  svg { display: block; width: 132px; height: auto; }
  h1 {
    margin-top: 44px;
    font-size: 168px;
    font-weight: 900;
    font-stretch: 108%;
    letter-spacing: -.04em;
    line-height: .9;
  }
  p { margin-top: 26px; font-size: 44px; font-weight: 700; letter-spacing: -.01em; }
  .tabs { display: grid; grid-template-columns: repeat(7, 1fr); height: 92px; border-top: 4px dashed #141414; }
  .tabs i { border-right: 4px dashed #141414; }
  .tabs i:first-child { background: #141414; }
  .tabs i:last-child { border-right: 0; }
</style>
</head>
<body>
  <main>
    <svg viewBox="0 0 30 26" fill="none" aria-hidden="true">
      <circle cx="4" cy="4" r="3.6" fill="#141414"/>
      <circle cx="4" cy="22" r="3.6" fill="#141414"/>
      <circle cx="26" cy="13" r="3.2" fill="#fff" stroke="#141414" stroke-width="1.8"/>
      <path d="M7 4H14C16 4 16 13 18 13M7 22H14C16 22 16 13 18 13" stroke="#141414" stroke-width="2"/>
    </svg>
    <h1>Bracketway</h1>
    <p>Tournament brackets</p>
  </main>
  <div class="tabs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
